<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Directory & Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
</head>
<body>
    <!-- Top Application Bar -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <h1 class="brand-title">Contacts</h1>
            </div>

            <!-- Global Search -->
            <div class="header-search">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="globalSearchInput" placeholder="Search contacts (name, phone, email, company)..." autocomplete="off">
                <button id="searchClearBtn" class="search-clear-btn" style="display:none;" aria-label="Clear search">&times;</button>
            </div>

            <!-- Header Actions -->
            <div class="header-actions">
                <button class="btn btn-primary" id="btnOpenAddModal">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Create contact</span>
                </button>

                <div class="dropdown-container">
                    <button class="btn btn-secondary" id="btnExportToggle">
                        <span>Export</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="exportDropdown">
                        <a href="/api/contacts/export/vcf" class="dropdown-item">Export as vCard (.vcf)</a>
                        <a href="/api/contacts/export/csv" class="dropdown-item">Export as CSV (.csv)</a>
                    </div>
                </div>

                <button class="btn btn-icon" id="btnThemeToggle" title="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace (Clean Split View) -->
    <main class="app-body">
        <!-- Sidebar: Contact List -->
        <aside class="sidebar-directory">
            <!-- Filter Segment -->
            <div class="sidebar-nav">
                <button class="segment-tab active" data-filter="all">All (<span id="countAll">0</span>)</button>
                <button class="segment-tab" data-filter="favorites">Favorites (<span id="countFavorites">0</span>)</button>
            </div>

            <!-- Filter and Sort Bar -->
            <div class="sidebar-filters">
                <select id="orgFilterSelect" class="filter-select">
                    <option value="all">All Companies</option>
                </select>

                <select id="sortSelect" class="filter-select">
                    <option value="name_asc">A–Z</option>
                    <option value="name_desc">Z–A</option>
                    <option value="org_asc">Company</option>
                    <option value="date_desc">Recent</option>
                </select>
            </div>

            <!-- Contacts List -->
            <div class="contact-items-list" id="contactsList">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading directory...</p>
                </div>
            </div>
        </aside>

        <!-- Right: Contact Detail Profile View -->
        <section class="profile-viewport" id="contactDetailPanel">
            <div class="empty-selection">
                <div class="empty-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 8v4"></path>
                        <path d="M12 16h.01"></path>
                    </svg>
                </div>
                <h3>No contact selected</h3>
                <p>Select a contact from the list on the left to view details.</p>
                <button class="btn btn-secondary" id="btnEmptyAdd">Create new contact</button>
            </div>
        </section>
    </main>

    <!-- Modal: Create / Edit Contact -->
    <div class="modal-backdrop" id="contactModal" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">New contact</h3>
                <button class="modal-close" data-close-modal aria-label="Close dialog">&times;</button>
            </div>
            <form id="contactForm">
                <input type="hidden" id="contactId" value="">
                <div class="modal-body form-grid">
                    <div class="form-field full-span">
                        <label for="contactName">Full name <span class="required">*</span></label>
                        <input type="text" id="contactName" class="form-input" required placeholder="e.g. Eleanor Vance">
                    </div>

                    <div class="form-field">
                        <label for="contactMobile">Phone number <span class="required">*</span></label>
                        <input type="tel" id="contactMobile" class="form-input" required placeholder="e.g. +1 555-0192">
                    </div>

                    <div class="form-field">
                        <label for="contactEmail">Email address</label>
                        <input type="email" id="contactEmail" class="form-input" placeholder="e.g. eleanor@company.com">
                    </div>

                    <div class="form-field">
                        <label for="contactOrg">Company / Organization</label>
                        <input type="text" id="contactOrg" class="form-input" list="orgOptions" placeholder="e.g. Acme Tech">
                        <datalist id="orgOptions"></datalist>
                    </div>

                    <div class="form-field checkbox-field">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="contactFavorite">
                            <span>Add to favorites</span>
                        </label>
                    </div>

                    <div class="form-field full-span">
                        <label for="contactAddress">Address</label>
                        <textarea id="contactAddress" class="form-textarea" rows="2" placeholder="Street, City, Postal Code..."></textarea>
                    </div>

                    <div class="form-field full-span">
                        <label for="contactNotes">Notes</label>
                        <textarea id="contactNotes" class="form-textarea" rows="2" placeholder="Additional notes or relationship details..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveContact">Save contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Confirm Delete -->
    <div class="modal-backdrop" id="deleteModal" style="display: none;" role="dialog" aria-modal="true">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h3 class="modal-title">Delete contact</h3>
                <button class="modal-close" data-close-modal aria-label="Close dialog">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this contact? This cannot be undone.</p>
                <div class="delete-summary-box" id="deleteContactInfo"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-stack" id="toastContainer" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}?v=2"></script>
</body>
</html>
